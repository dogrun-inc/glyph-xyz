<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>glyph-xyz</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js" defer></script>
  <script src="main.js" defer></script>
</head>
<body>
  <aside class="controls" aria-label="生成設定">
    <h1>glyph-xyz</h1>
    <div class="axes">
      <label>X軸 <input id="glyph-x" type="text" value="G"></label>
      <label>Y軸 <input id="glyph-y" type="text" value="E"></label>
      <label>Z軸 <input id="glyph-z" type="text" value="B"></label>
    </div>
    <label>基準サイズ（mm）
      <input id="size" type="number" value="30" min="5" max="200" step="any" required>
    </label>
    <label>フォント
      <input id="font" type="file" accept=".ttf,.otf" aria-describedby="font-help" disabled>
    </label>
    <small id="font-help">未選択の場合はデフォルトフォントを使用します。</small>
    <button type="button" id="generate-btn" disabled>立体を生成</button>
    <div id="status" class="status" role="status">Pyodide を読み込み中...</div>
    <div id="parts-warning" role="alert" hidden></div>
    <div class="exports">
      <button type="button" disabled>STL ダウンロード</button>
      <button type="button" disabled>STEP ダウンロード</button>
    </div>
  </aside>
  <main class="workspace" aria-label="3Dビューア">
    <div id="viewer" role="region" aria-label="立体プレビュー" aria-describedby="preview-description"></div>
    <p id="preview-description" hidden>一辺30 mmの立方体です。X・Y・Z軸の範囲はいずれも0〜30 mmです。</p>
    <div class="toolbar" role="group" aria-label="カメラ操作">
      <button type="button" id="projection" disabled>平行投影</button>
      <button type="button" data-view="x" disabled>+X 視点</button>
      <button type="button" data-view="y" disabled>-Y 視点</button>
      <button type="button" data-view="z" disabled>+Z 視点</button>
      <button type="button" data-view="iso" disabled>斜め視点</button>
    </div>
  </main>
</body>
</html>
